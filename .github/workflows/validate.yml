name: Validate yoyo-loop

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate skills and safety contracts
        run: node scripts/validate.mjs
      - name: Test the guard hook
        run: bash hooks/guard.test.sh
      - name: Test the repo-map template
        run: node scripts/repo-map-template.test.mjs
